# Chang sau CI: dong goi ung dung thanh container image, quet lo hong, roi day
# len GitHub Container Registry.
#
# Vi sao tach khoi ci.yml: ci.yml tra loi "code co dung khong", cd.yml tra loi
# "co artifact nao san sang deploy khong". Hai cau hoi khac nhau, hong theo kieu
# khac nhau, va cd chi nen chay khi ci da xanh.
#
# Vi sao ghcr.io chu khong phai Artifact Registry cua Google: ghcr mien phi
# khong gioi han cho image public, con Artifact Registry chi free 0,5 GB - image
# nay do duoc 1,45 GB nen vuot ngay tu lan build dau.

name: CD

on:
  # Khong bat truc tiep vao push: doi ci.yml xanh roi moi dong goi, de khong
  # bao gio day mot image sinh ra tu commit hong len registry.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # workflow_run ban ca khi CI DO, no chi bao "CI da chay xong" -> phai tu loc.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write         # quyen day image len ghcr.io
      security-events: write  # quyen day ket qua Trivy vao tab Security cua repo

    steps:
      # workflow_run chay trong ngu canh nhanh mac dinh chu KHONG tu lay commit
      # da kich hoat CI. Khong ghi ro head_sha la co ngay dong goi nham code:
      # CI xanh o commit A, nhung image lai build tu commit B.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # ghcr.io chi nhan ten toan chu thuong, ma ten chu repo thi co chu hoa.
      - name: Dat ten image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Token nay GitHub tu cap cho moi lan chay - khong phai tao secret nao.
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build TRUOC, day SAU: quet xong moi day. Neu day truoc roi moi quet thi
      # image hong da nam san tren registry cho nguoi khac keo ve.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          # Hai tag: latest cho tien tay, va tag theo SHA de truy nguoc image
          # dang chay sinh ra tu commit nao. Deploy phai dung tag SHA.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha || github.sha }}
          # Cache cua GitHub Actions: build sau chi cai lai thu vien khi
          # requirements.txt doi, khong phai lam lai tu dau moi lan.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Hai buoc quet, hai muc dich khac nhau.
      # Buoc 1 - BAO CAO: gom het HIGH va CRITICAL vao tab Security de con theo doi.
      - name: Quet lo hong va bao cao
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:latest
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Dua ket qua quet len tab Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

      # Buoc 2 - CHAN: chi chan o CRITICAL va chi khi DA CO ban va.
      # Chan theo HIGH thi CD do vinh vien vi anh python:3.12-slim luc nao cung
      # con vai CVE HIGH chua ai va - mot cong luon do thi khong ai them nhin,
      # con te hon la khong co cong.
      - name: Chan neu con CVE nghiem trong da co ban va
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:latest
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Day image len ghcr.io
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.event.workflow_run.head_sha || github.sha }}"

      - name: Ghi lai image vua day
        run: |
          {
            echo "### Image da day"
            echo ""
            echo '```'
            echo "docker pull $IMAGE:${{ github.event.workflow_run.head_sha || github.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # Dua image vua day len Azure Container Apps.
  #
  # Vi sao Container Apps chu khong phai AKS: mot agent hai tool khong can
  # Kubernetes. Container Apps co scale-to-zero, nen khong ai dung thi khong
  # ton dong nao trong goi Azure for Students.
  #
  # Vi sao OIDC chu khong phai service principal secret: GitHub tu phat token
  # song 1 tieng, Azure doi lay credential ngan han. KHONG co key dai han nao
  # nam trong repo secrets - mat repo cung khong mat tai khoan cloud.
  # ==========================================================================
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # BAT BUOC: khong co dong nay thi GitHub khong phat OIDC token
      contents: read

    env:
      RG: rg-travel-agent
      # Neon o Singapore, dat app o eastus lam moi lan ghi checkpoint mat them
      # ~200ms. Van phai chiu: southeastasia bi Azure chan cho tai khoan sinh vien.
      LOCATION: eastus
      ENVIRONMENT: travel-agent-env
      APP: travel-agent-api

    steps:
      - name: Dat ten image
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "TAG=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_ENV"

      # Khong co mat khau o day: chi co 3 dinh danh, deu khong phai bi mat.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Cai extension containerapp
        run: az extension add --name containerapp --upgrade --only-show-errors

      # Tao mot lan roi thoi. Lan sau `show` thanh cong -> bo qua.
      - name: Tao Container Apps environment neu chua co
        run: |
          # --logs-destination none: KHONG tao Log Analytics workspace kem theo.
          # Mac dinh no tu tao mot cai, va chinh cai workspace do bi Azure chan
          # (RequestDisallowedByAzure) o ca southeastasia lan eastus. Bo workspace
          # di thi khong con gi de chan.
          # Danh doi: khong luu log dai han. Log truc tiep van xem duoc bang
          # `az containerapp logs show`, con so lieu da co Prometheus/Grafana lo.
          az containerapp env show -n "$ENVIRONMENT" -g "$RG" --only-show-errors >/dev/null 2>&1 \
            || az containerapp env create -n "$ENVIRONMENT" -g "$RG" -l "$LOCATION" --logs-destination none --only-show-errors

      # Lan dau: create. Nhung lan sau: update - chi doi image, giu nguyen cau hinh.
      - name: Trien khai
        run: |
          if az containerapp show -n "$APP" -g "$RG" --only-show-errors >/dev/null 2>&1; then
            echo "App da ton tai -> chi doi image sang $TAG"
            az containerapp update -n "$APP" -g "$RG" \
              --image "$IMAGE:$TAG" --only-show-errors
          else
            echo "Tao app lan dau"
            az containerapp create -n "$APP" -g "$RG" \
              --environment "$ENVIRONMENT" \
              --image "$IMAGE:$TAG" \
              --target-port 8000 \
              --ingress external \
              --min-replicas 0 \
              --max-replicas 2 \
              --cpu 0.5 --memory 1.0Gi \
              --secrets "google-api-key=${{ secrets.GOOGLE_API_KEY }}" \
                        "database-url=${{ secrets.DATABASE_URL }}" \
              --env-vars GOOGLE_API_KEY=secretref:google-api-key \
                         DATABASE_URL=secretref:database-url \
              --only-show-errors
          fi

      # min-replicas=0: khong ai dung thi khong chay replica nao -> $0.
      # Danh doi la cold start ~15-20s cho request dau tien.
      - name: Bao dam scale ve 0 khi khong ai dung
        run: |
          az containerapp update -n "$APP" -g "$RG" \
            --min-replicas 0 --max-replicas 2 --only-show-errors

      - name: Kiem tra /healthz
        run: |
          FQDN=$(az containerapp show -n "$APP" -g "$RG" \
            --query properties.configuration.ingress.fqdn -o tsv --only-show-errors)
          echo "URL: https://$FQDN"
          # Cold start co the lau -> thu lai vai lan thay vi that bai ngay.
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /dev/null -m 30 -w "%{http_code}" "https://$FQDN/healthz" || echo 000)
            echo "  lan $i: $CODE"
            [ "$CODE" = "200" ] && break
            sleep 15
          done
          [ "$CODE" = "200" ] || { echo "::error::/healthz khong tra 200"; exit 1; }
          {
            echo "### Da deploy len Azure Container Apps"
            echo ""
            echo "- URL: https://$FQDN"
            echo "- Docs: https://$FQDN/docs"
            echo "- Image: \`$IMAGE:$TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
