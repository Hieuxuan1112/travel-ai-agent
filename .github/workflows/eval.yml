# Cong chan chat luong agent.
# Tach rieng khoi ci.yml vi workflow nay GOI LLM THAT: can secret va ton tien
# (khoang $0.006 mot lan chay), trong khi unit test thi luon chay duoc mien phi.

name: Eval gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    # PR tu fork khong duoc cap secret -> bo qua, khong de CI do oan vi mot ly do
    # khong lien quan gi den chat luong agent.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      MIN_TOOL_ACCURACY: "0.85"
      MIN_JUDGE_SCORE: "3.5"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Kiem tra secret co DUNG khong, khong chi kiem tra co TON TAI khong.
      # Truoc day chi test rong/khong rong -> key sai thi eval chet voi "exit code 1"
      # khong ro nguyen nhan, mat rat nhieu thoi gian do tim.
      - name: Check the API key actually works
        id: check
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Secret GOOGLE_API_KEY chua duoc dat - bo qua cong chan." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - <<'PY'
          import os, sys
          from google import genai
          key = os.environ["GOOGLE_API_KEY"]
          if key != key.strip():
              print("::error::Secret GOOGLE_API_KEY co khoang trang thua o dau/cuoi.")
              sys.exit(1)
          try:
              genai.Client(api_key=key).models.list()
          except Exception as exc:
              print(f"::error::Secret GOOGLE_API_KEY khong dung duoc: {str(exc)[:200]}")
              sys.exit(1)
          print("API key OK")
          PY
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Run the eval gate
        if: steps.check.outputs.run == 'true'
        run: python evals/eval_agent.py --gate

      - name: Upload results.md
        if: steps.check.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results.md
